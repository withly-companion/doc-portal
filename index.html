<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Withly Docs</title>
<style>
  :root{
    --bg:#11151c; --panel:#171c25; --panel2:#1e2430; --line:#2a3140;
    --text:#e8ecf1; --muted:#8b96a8; --accent:#5b8cff; --danger:#ef5a5a; --ok:#3ecf8e;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh}
  .center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:36px;width:100%;max-width:380px}
  .card h1{font-size:20px;margin:0 0 4px}
  .card p.sub{color:var(--muted);font-size:13px;margin:0 0 24px}
  label{display:block;font-size:12px;color:var(--muted);margin:16px 0 6px;text-transform:uppercase;letter-spacing:.05em}
  input{width:100%;padding:11px 12px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--text);font-size:14px}
  input:focus{outline:none;border-color:var(--accent)}
  button{cursor:pointer;border:none;border-radius:8px;font-size:14px;font-weight:600;padding:11px 16px;transition:opacity .15s}
  button:hover{opacity:.88}
  button:active{opacity:.7}
  button:disabled{opacity:.5;cursor:not-allowed}
  button:focus-visible, input:focus-visible, .crumb:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .btn-primary{background:var(--accent);color:#fff;width:100%;margin-top:22px}
  .btn-danger{background:var(--danger);color:#fff}
  .btn-ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
  .err{color:var(--danger);font-size:13px;margin-top:10px;min-height:16px}

  .app{max-width:900px;margin:0 auto;padding:28px 20px 60px}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}
  .topbar h1{font-size:19px;margin:0}
  .topbar .who{color:var(--muted);font-size:13px}
  .topbar .who b{color:var(--text)}
  .badge{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:2px 10px;font-size:11px;margin-left:8px;color:var(--accent)}
  .breadcrumb{display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin-bottom:14px;font-size:13px;color:var(--muted)}
  .breadcrumb span.crumb{cursor:pointer;color:var(--accent)}
  .breadcrumb span.crumb:hover{text-decoration:underline}
  .breadcrumb span.sep{color:var(--muted)}
  .toolbar{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
  .toolbar input[type=text]{flex:1;min-width:160px}
  .list{border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:none}
  .row:hover{background:var(--panel2)}
  .row.folder .fname{cursor:pointer}
  .fname{font-size:14px;font-weight:500;word-break:break-word}
  .fmeta{font-size:12px;color:var(--muted);margin-top:2px}
  .spacer{flex:1}
  .row a, .row button{font-size:13px}
  .empty{padding:40px 16px;text-align:center;color:var(--muted);font-size:14px}
  .hidden{display:none !important}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:12px 18px;border-radius:10px;font-size:13px;z-index:40}
  .toast.ok{border-color:var(--ok)}
  .toast.err{border-color:var(--danger)}
  .signout{background:none;border:none;color:var(--muted);text-decoration:underline;padding:0;font-weight:400}

  /* ---- document viewer ---- */
  #previewModal{z-index:30;padding:16px}
  .viewer{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(1100px,100%);height:min(92vh,100%);display:flex;flex-direction:column;overflow:hidden}
  .viewer-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .viewer-title{font-size:14px;font-weight:600;word-break:break-all;max-width:100%}
  .viewer-head button{padding:8px 12px;font-size:13px}
  .viewer-body{flex:1;min-height:0;background:#0d1117;display:flex;align-items:center;justify-content:center;overflow:auto}
  .viewer-body iframe{width:100%;height:100%;border:none;background:#fff}
  .viewer-body img{max-width:100%;max-height:100%;object-fit:contain}
  .viewer-body video{max-width:100%;max-height:100%}
  .viewer-body pre{margin:0;width:100%;height:100%;overflow:auto;padding:18px;white-space:pre-wrap;word-break:break-word;font-size:13px;line-height:1.55;color:var(--text);text-align:left;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .pv-msg{color:var(--muted);font-size:14px;text-align:center;padding:32px;line-height:1.6}
  .pv-msg b{color:var(--text);display:block;margin-bottom:6px;font-size:15px}
  @media (max-width:560px){ .viewer-head .viewer-title{width:100%} }
</style>
</head>
<body>

<!-- ============ LOGIN SCREEN ============ -->
<div id="loginScreen" class="center">
  <div class="card">
    <h1>Withly Document Portal</h1>

    <div id="emailLoginView">
      <p class="sub">Sign in with the account you were given.</p>
      <label>Email</label>
      <input id="loginEmail" type="email" placeholder="you@team.com" autocomplete="username">
      <label>Password</label>
      <input id="loginPassword" type="password" placeholder="••••••••" autocomplete="current-password">
      <button class="btn-primary" onclick="attemptLogin()" id="loginBtn">Sign in</button>
      <div class="err" id="loginErr"></div>
      <p class="sub" style="margin:16px 0 0">
        Developer? <span class="crumb" style="cursor:pointer;color:var(--accent)" onclick="showPinView()">Enter PIN instead</span>
      </p>
    </div>

    <div id="pinLoginView" class="hidden">
      <p class="sub">Enter the team PIN to view and download documents.</p>
      <label>PIN</label>
      <input id="pinInput" type="password" inputmode="numeric" maxlength="4" placeholder="••••" autocomplete="off">
      <button class="btn-primary" onclick="attemptPinLogin()" id="pinBtn">Enter</button>
      <div class="err" id="pinErr"></div>
      <p class="sub" style="margin:16px 0 0">
        <span class="crumb" style="cursor:pointer;color:var(--accent)" onclick="showEmailView()">Back to account sign in</span>
      </p>
    </div>
  </div>
</div>

<!-- ============ MAIN APP ============ -->
<div id="appScreen" class="app hidden">
  <div class="topbar">
    <h1>📚 Withly Document Portal</h1>
    <div class="who">Signed in as <b id="whoName"></b><span id="roleBadge" class="badge hidden"></span>
      &nbsp;·&nbsp;<button class="signout" onclick="signOut()">Sign out</button>
    </div>
  </div>

  <div id="breadcrumb" class="breadcrumb"></div>

  <div class="toolbar">
    <input id="searchBox" type="text" placeholder="Search this folder..." oninput="renderList()">
    <button class="btn-ghost" onclick="loadFiles()">↻ Refresh</button>
    <button class="btn-ghost hidden" id="newFolderBtn" onclick="createFolder()">📁+ New folder</button>
    <button class="btn-ghost hidden" id="uploadFolderBtn" onclick="document.getElementById('folderInput').click()">⇪ Upload folder</button>
    <button class="btn-primary hidden" id="uploadBtn" style="margin-top:0;width:auto" onclick="openUpload()">＋ Upload file</button>
  </div>

  <input type="file" id="folderInput" webkitdirectory directory multiple class="hidden" onchange="uploadFolder(this.files)">

  <div id="fileList" class="list"></div>
</div>

<!-- ============ UPLOAD FILE MODAL (admins + developers) ============ -->
<div id="uploadModal" class="modal-bg hidden">
  <div class="card" style="max-width:340px">
    <h1>Upload document</h1>
    <p class="sub" id="uploadModalSub">This file will be visible to everyone with portal access.</p>
    <label>File</label>
    <input id="fileInput" type="file">
    <div style="display:flex;gap:10px;margin-top:22px">
      <button class="btn-ghost" style="flex:1" onclick="closeUploadModal()">Cancel</button>
      <button class="btn-primary" style="margin-top:0;flex:1" id="doUploadBtn" onclick="doUpload()">Upload</button>
    </div>
    <div class="err" id="uploadErr"></div>
  </div>
</div>

<!-- ============ GENERIC DIALOG (rename / confirm) ============ -->
<div id="dialog" class="modal-bg hidden">
  <div class="card" style="max-width:380px">
    <h1 id="dlgTitle"></h1>
    <p class="sub" id="dlgMsg" style="margin-bottom:0"></p>
    <div id="dlgInputWrap">
      <label id="dlgLabel">Name</label>
      <input id="dlgInput" type="text" autocomplete="off">
    </div>
    <div style="display:flex;gap:10px;margin-top:22px">
      <button class="btn-ghost" style="flex:1" id="dlgCancel">Cancel</button>
      <button class="btn-primary" style="margin-top:0;flex:1" id="dlgOk">Save</button>
    </div>
  </div>
</div>

<!-- ============ DOCUMENT VIEWER ============ -->
<div id="previewModal" class="modal-bg hidden">
  <div class="viewer">
    <div class="viewer-head">
      <div class="viewer-title" id="pvTitle"></div>
      <div class="spacer"></div>
      <button class="btn-ghost" id="pvOpen">Open in new tab</button>
      <button class="btn-ghost" id="pvDownload">Download</button>
      <button class="btn-ghost" id="pvClose">✕ Close</button>
    </div>
    <div class="viewer-body" id="pvBody"></div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* =========================================================
   CONFIG — Supabase → Project Settings → API
   ========================================================= */
const SUPABASE_URL      = "https://hqkeutdxpfbikdfdwzio.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_galWq5OfhueWjTj3FcSSXQ_ZMrbSdhW";
const BUCKET_NAME       = "documents";

const DEV_PIN      = "2255";
const DEV_EMAIL    = "dev@withly.local";
const DEV_PASSWORD = "81231100";

// Office files (.docx/.xlsx/.pptx) cannot be rendered by a browser on their own.
// When this is true they are previewed through Microsoft's public Office viewer,
// which means the file's temporary signed link is read by Microsoft's servers.
// Set to false to keep every document inside your own infrastructure — Office
// files will then offer download only.
const USE_OFFICE_VIEWER = true;
/* ========================================================= */

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { persistSession: false, autoRefreshToken: false }
});

let currentRole = 'viewer';
let currentPath = '';
let allItems = [];

/* Roles:
     admin     — upload, create folders, rename, delete
     developer — upload and create folders only (PIN sign-in lands here)
     viewer    — preview and download only
   Move 'developer' into canManage() below if devs should also rename/delete. */
function canUpload(){ return currentRole === 'admin' || currentRole === 'developer'; }
function canManage(){ return currentRole === 'admin'; }

function pathJoin(base, name){ return base ? base + '/' + name : name; }
function parentPath(path){ const i = path.lastIndexOf('/'); return i === -1 ? '' : path.substring(0, i); }
function baseName(path){ return path.split('/').pop(); }
function extOf(name){ const i = name.lastIndexOf('.'); return i === -1 ? '' : name.slice(i+1).toLowerCase(); }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function showToast(msg, type){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + (type||'');
  t.classList.remove('hidden');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>t.classList.add('hidden'), 3500);
}

/* ---------------------------------------------------------
   Dialogs — replaces prompt()/confirm(), which are silently
   blocked in sandboxed iframes and some embedded browsers.
   --------------------------------------------------------- */
let dlgResolve = null;
function openDialog({title, message='', label='Name', value=null, okText='Save', danger=false}){
  const wrap = document.getElementById('dialog');
  const input = document.getElementById('dlgInput');
  const ok = document.getElementById('dlgOk');
  document.getElementById('dlgTitle').textContent = title;
  document.getElementById('dlgMsg').textContent = message;
  document.getElementById('dlgMsg').classList.toggle('hidden', !message);
  document.getElementById('dlgLabel').textContent = label;
  document.getElementById('dlgInputWrap').classList.toggle('hidden', value === null);
  input.value = value === null ? '' : value;
  ok.textContent = okText;
  ok.className = (danger ? 'btn-danger' : 'btn-primary');
  ok.style.cssText = 'margin-top:0;flex:1';
  wrap.classList.remove('hidden');
  if(value !== null){
    input.focus();
    const dot = input.value.lastIndexOf('.');
    input.setSelectionRange(0, dot > 0 ? dot : input.value.length); // keep the extension out of the selection
  } else { ok.focus(); }
  return new Promise(res => { dlgResolve = res; });
}
function closeDialog(result){
  document.getElementById('dialog').classList.add('hidden');
  const r = dlgResolve; dlgResolve = null;
  if(r) r(result);
}
document.getElementById('dlgCancel').addEventListener('click', ()=>closeDialog(null));
document.getElementById('dlgOk').addEventListener('click', ()=>{
  const wrap = document.getElementById('dlgInputWrap');
  closeDialog(wrap.classList.contains('hidden') ? true : document.getElementById('dlgInput').value);
});
document.getElementById('dlgInput').addEventListener('keydown', e => {
  if(e.key === 'Enter') closeDialog(document.getElementById('dlgInput').value);
});
function askText(opts){ return openDialog({value:'', ...opts}); }
function askConfirm(opts){ return openDialog({value:null, okText:'Delete', danger:true, ...opts}).then(v => v === true); }

/* --------------------------- auth --------------------------- */
function showPinView(){
  document.getElementById('emailLoginView').classList.add('hidden');
  document.getElementById('pinLoginView').classList.remove('hidden');
}
function showEmailView(){
  document.getElementById('pinLoginView').classList.add('hidden');
  document.getElementById('emailLoginView').classList.remove('hidden');
}

async function completeLogin(email, userId, forcedRole){
  const { data: profile } = await sb.from('profiles').select('role').eq('id', userId).single();
  // A profile row still wins if it grants more (e.g. the dev account is an admin).
  currentRole = profile?.role === 'admin' ? 'admin' : (forcedRole || profile?.role || 'viewer');
  document.getElementById('whoName').textContent = email;
  const badge = document.getElementById('roleBadge');
  if(currentRole === 'admin' || currentRole === 'developer'){
    badge.textContent = currentRole === 'admin' ? 'Admin' : 'Developer';
    badge.classList.remove('hidden');
  }
  if(canUpload()){
    document.getElementById('uploadBtn').classList.remove('hidden');
    document.getElementById('newFolderBtn').classList.remove('hidden');
    document.getElementById('uploadFolderBtn').classList.remove('hidden');
  }
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('appScreen').classList.remove('hidden');
  loadFiles();
}

async function attemptLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const err = document.getElementById('loginErr');
  const btn = document.getElementById('loginBtn');
  err.textContent = '';
  if(!email || !password){ err.textContent = 'Enter your email and password.'; return; }
  btn.disabled = true; btn.textContent = 'Signing in...';
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  btn.disabled = false; btn.textContent = 'Sign in';
  if(error){ err.textContent = 'Incorrect email or password.'; return; }
  completeLogin(email, data.user.id);
}

async function attemptPinLogin(){
  const pin = document.getElementById('pinInput').value.trim();
  const err = document.getElementById('pinErr');
  const btn = document.getElementById('pinBtn');
  err.textContent = '';
  if(pin !== DEV_PIN){ err.textContent = 'Incorrect PIN.'; return; }
  btn.disabled = true; btn.textContent = 'Entering...';
  const { data, error } = await sb.auth.signInWithPassword({ email: DEV_EMAIL, password: DEV_PASSWORD });
  btn.disabled = false; btn.textContent = 'Enter';
  if(error){ err.textContent = 'Could not sign in. Contact your admin.'; return; }
  completeLogin('Developer', data.user.id, 'developer');
}

async function signOut(){ await sb.auth.signOut(); location.reload(); }

document.getElementById('loginPassword').addEventListener('keydown', e => { if(e.key==='Enter') attemptLogin(); });
document.getElementById('pinInput').addEventListener('keydown', e => { if(e.key==='Enter') attemptPinLogin(); });

/* --------------------------- listing --------------------------- */
function renderBreadcrumb(){
  const el = document.getElementById('breadcrumb');
  const parts = currentPath ? currentPath.split('/') : [];
  let html = `<span class="crumb" data-act="go" data-path="">🏠 Home</span>`;
  let built = '';
  parts.forEach(p => {
    built = pathJoin(built, p);
    html += `<span class="sep">&nbsp;/&nbsp;</span><span class="crumb" data-act="go" data-path="${escapeHtml(built)}">${escapeHtml(p)}</span>`;
  });
  el.innerHTML = html;
}

function goToPath(path){ currentPath = path; document.getElementById('searchBox').value = ''; loadFiles(); }

async function loadFiles(){
  const { data, error } = await sb.storage.from(BUCKET_NAME).list(currentPath, {
    limit: 1000, sortBy: { column: 'name', order: 'asc' }
  });
  if(error){ showToast('Could not load files: ' + error.message, 'err'); return; }
  allItems = (data || []).filter(f => !f.name.startsWith('.'));
  renderBreadcrumb();
  renderList();
}

function renderList(){
  const q = document.getElementById('searchBox').value.toLowerCase();
  const list = document.getElementById('fileList');
  const filtered = allItems.filter(f => f.name.toLowerCase().includes(q));
  const folders = filtered.filter(f => f.id === null);
  const files = filtered.filter(f => f.id !== null);

  if(filtered.length === 0){
    list.innerHTML = `<div class="empty">${q ? 'No files here match “' + escapeHtml(q) + '”.' : 'This folder is empty.'}</div>`;
    return;
  }

  const folderRows = folders.map(f => {
    const p = escapeHtml(pathJoin(currentPath, f.name));
    const adminBtns = canManage()
      ? `<button class="btn-ghost" data-act="rename-folder" data-path="${p}">Rename</button>
         <button class="btn-danger" data-act="delete-folder" data-path="${p}">Delete</button>` : '';
    return `
      <div class="row folder">
        <div class="fname" data-act="go" data-path="${p}">📁 ${escapeHtml(f.name)}</div>
        <div class="spacer"></div>
        ${adminBtns}
      </div>`;
  }).join('');

  const fileRows = files.map(f => {
    const p = escapeHtml(pathJoin(currentPath, f.name));
    const sizeKB = f.metadata && f.metadata.size ? (f.metadata.size/1024).toFixed(0) + ' KB' : '';
    const date = f.created_at ? new Date(f.created_at).toLocaleDateString() : '';
    const adminBtns = canManage()
      ? `<button class="btn-ghost" data-act="rename-file" data-path="${p}">Rename</button>
         <button class="btn-danger" data-act="delete-file" data-path="${p}">Delete</button>` : '';
    return `
      <div class="row">
        <div>
          <div class="fname">📄 ${escapeHtml(f.name)}</div>
          <div class="fmeta">${sizeKB}${sizeKB && date ? ' · ' : ''}${date}</div>
        </div>
        <div class="spacer"></div>
        <button class="btn-ghost" data-act="preview" data-path="${p}">Preview</button>
        <button class="btn-ghost" data-act="download" data-path="${p}">Download</button>
        ${adminBtns}
      </div>`;
  }).join('');

  list.innerHTML = folderRows + fileRows;
}

// One delegated listener instead of inline onclick — file names containing
// quotes or backslashes used to break the generated handler string.
function handleAction(e){
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const path = el.dataset.path;
  const act = el.dataset.act;
  // Cosmetic guard only — the real limits live in your Supabase storage policies.
  if(/^(rename|delete)-/.test(act) && !canManage()){
    showToast('Only an admin can rename or delete.', 'err');
    return;
  }
  switch(act){
    case 'go': goToPath(path); break;
    case 'preview': previewFile(path); break;
    case 'download': downloadFile(path); break;
    case 'rename-file': renameFile(path); break;
    case 'delete-file': deleteFile(path); break;
    case 'rename-folder': renameFolder(path); break;
    case 'delete-folder': deleteFolder(path); break;
  }
}
document.getElementById('fileList').addEventListener('click', handleAction);
document.getElementById('breadcrumb').addEventListener('click', handleAction);

/* --------------------------- rename --------------------------- */
function storageErrorText(err){
  const m = (err && err.message) ? err.message : String(err);
  if(/exists/i.test(m)) return 'A file with that name is already here. Pick a different name.';
  if(/row-level security|Unauthorized|not authorized|403/i.test(m))
    return 'Storage rejected the change. Your bucket needs UPDATE (or INSERT + DELETE) policies on storage.objects for admins.';
  if(/not found|404/i.test(m)) return 'That file is no longer here. Refresh the list.';
  return m;
}

// Rename = move. If the bucket has no UPDATE policy (the usual cause of a
// silent rename failure) fall back to copy + delete, which only needs
// INSERT and DELETE.
async function moveObject(from, to){
  const { error: moveErr } = await sb.storage.from(BUCKET_NAME).move(from, to);
  if(!moveErr) return { ok:true };
  console.warn('move() failed, trying copy + delete:', moveErr);

  const { error: copyErr } = await sb.storage.from(BUCKET_NAME).copy(from, to);
  if(copyErr) return { ok:false, message: storageErrorText(copyErr) };

  const { error: delErr } = await sb.storage.from(BUCKET_NAME).remove([from]);
  if(delErr) return { ok:false, message: 'Saved under the new name, but the old copy is still there: ' + storageErrorText(delErr) };
  return { ok:true };
}

function cleanName(name){ return name.trim().replace(/[\/\\]+/g, '-'); }

async function renameFile(path){
  const oldName = baseName(path);
  const answer = await askText({ title:'Rename file', label:'File name', value:oldName, okText:'Rename' });
  if(answer === null) return;
  const name = cleanName(answer);
  if(!name || name === oldName) return;

  if(allItems.some(i => i.name === name)){
    showToast('“' + name + '” already exists in this folder.', 'err');
    return;
  }
  if(extOf(name) !== extOf(oldName)){
    const go = await askConfirm({
      title:'Change the file type?',
      message:`“${oldName}” ends in .${extOf(oldName) || '(none)'} but the new name ends in .${extOf(name) || '(none)'}. The file may stop opening correctly.`,
      okText:'Rename anyway', danger:false
    });
    if(!go) return;
  }

  showToast('Renaming…');
  const res = await moveObject(path, pathJoin(parentPath(path), name));
  if(!res.ok){ showToast('Rename failed: ' + res.message, 'err'); return; }
  showToast('Renamed to ' + name, 'ok');
  loadFiles();
}

async function renameFolder(path){
  const oldName = baseName(path);
  const answer = await askText({ title:'Rename folder', label:'Folder name', value:oldName, okText:'Rename' });
  if(answer === null) return;
  const name = cleanName(answer);
  if(!name || name === oldName) return;
  if(allItems.some(i => i.name === name)){
    showToast('“' + name + '” already exists in this folder.', 'err');
    return;
  }

  const newFolderPath = pathJoin(parentPath(path), name);
  try{
    const filePaths = await collectAllFilePaths(path);
    if(filePaths.length === 0) throw new Error('This folder has no files to move.');
    let done = 0;
    for(const filePath of filePaths){
      const relative = filePath.slice(path.length + 1);
      const res = await moveObject(filePath, pathJoin(newFolderPath, relative));
      if(!res.ok) throw new Error(res.message);
      done++;
      if(filePaths.length > 3) showToast(`Renaming… ${done}/${filePaths.length}`);
    }
    showToast('Folder renamed to ' + name, 'ok');
    loadFiles();
  }catch(e){
    showToast('Rename failed: ' + storageErrorText(e), 'err');
    loadFiles();
  }
}

/* --------------------------- preview --------------------------- */
const MIME = {
  pdf:'application/pdf',
  png:'image/png', jpg:'image/jpeg', jpeg:'image/jpeg', gif:'image/gif',
  webp:'image/webp', svg:'image/svg+xml', bmp:'image/bmp', ico:'image/x-icon', avif:'image/avif',
  txt:'text/plain', md:'text/plain', csv:'text/plain', tsv:'text/plain', json:'text/plain',
  log:'text/plain', xml:'text/plain', yml:'text/plain', yaml:'text/plain', js:'text/plain',
  css:'text/plain', sql:'text/plain', py:'text/plain', sh:'text/plain',
  html:'text/html', htm:'text/html',
  mp4:'video/mp4', webm:'video/webm', ogv:'video/ogg', mov:'video/quicktime',
  mp3:'audio/mpeg', wav:'audio/wav', ogg:'audio/ogg', m4a:'audio/mp4'
};
const OFFICE_EXT = ['doc','docx','xls','xlsx','ppt','pptx'];
const TEXT_MAX = 2 * 1024 * 1024;

let pvPath = null, pvUrl = null, pvObjectUrl = null;

function setPvBody(html){ document.getElementById('pvBody').innerHTML = html; }
function pvMessage(title, detail){ setPvBody(`<div class="pv-msg"><b>${escapeHtml(title)}</b>${escapeHtml(detail||'')}</div>`); }

function closePreview(){
  document.getElementById('previewModal').classList.add('hidden');
  setPvBody('');
  if(pvObjectUrl){ URL.revokeObjectURL(pvObjectUrl); pvObjectUrl = null; }
  pvPath = null; pvUrl = null;
}
document.getElementById('pvClose').addEventListener('click', closePreview);
document.getElementById('previewModal').addEventListener('click', e => { if(e.target.id === 'previewModal') closePreview(); });
document.addEventListener('keydown', e => {
  if(e.key !== 'Escape') return;
  if(!document.getElementById('previewModal').classList.contains('hidden')) closePreview();
  else if(!document.getElementById('dialog').classList.contains('hidden')) closeDialog(null);
});
document.getElementById('pvDownload').addEventListener('click', ()=>{ if(pvPath) downloadFile(pvPath); });
document.getElementById('pvOpen').addEventListener('click', ()=>{
  // opened straight from the click, so the popup blocker leaves it alone
  if(pvObjectUrl || pvUrl) window.open(pvObjectUrl || pvUrl, '_blank', 'noopener');
});

async function previewFile(path){
  pvPath = path;
  const name = baseName(path);
  const ext = extOf(name);
  document.getElementById('pvTitle').textContent = name;
  document.getElementById('previewModal').classList.remove('hidden');
  if(pvObjectUrl){ URL.revokeObjectURL(pvObjectUrl); pvObjectUrl = null; }
  pvMessage('Loading preview…', '');

  const isOffice = OFFICE_EXT.includes(ext);
  const { data, error } = await sb.storage.from(BUCKET_NAME).createSignedUrl(path, isOffice ? 3600 : 600);
  if(error){ pvMessage('Could not open this file', storageErrorText(error)); return; }
  pvUrl = data.signedUrl;

  if(isOffice){
    if(!USE_OFFICE_VIEWER){
      pvMessage('Word, Excel and PowerPoint files need an app to open',
        'Download the file to read it, or set USE_OFFICE_VIEWER to true to preview it here.');
      return;
    }
    setPvBody(`<iframe src="https://view.officeapps.live.com/op/embed.aspx?src=${encodeURIComponent(pvUrl)}"
                       title="${escapeHtml(name)}"></iframe>`);
    return;
  }

  // Fetch the bytes and re-wrap them with the right content type. Files uploaded
  // as application/octet-stream would otherwise download instead of displaying.
  try{
    const res = await fetch(pvUrl);
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const raw = await res.blob();
    const type = MIME[ext] || (raw.type && raw.type !== 'application/octet-stream' ? raw.type : '');

    if(type === 'text/plain'){
      const text = raw.size > TEXT_MAX ? (await raw.slice(0, TEXT_MAX).text()) + '\n\n… file truncated for preview.' : await raw.text();
      setPvBody(`<pre>${escapeHtml(text)}</pre>`);
      pvObjectUrl = URL.createObjectURL(new Blob([raw], { type:'text/plain' }));
      return;
    }

    if(!type){
      pvMessage('No preview for .' + (ext || 'this file type'), 'Download it to open in the right app.');
      return;
    }

    pvObjectUrl = URL.createObjectURL(new Blob([raw], { type }));

    if(type.startsWith('image/')){
      setPvBody(`<img src="${pvObjectUrl}" alt="${escapeHtml(name)}">`);
    } else if(type.startsWith('video/')){
      setPvBody(`<video src="${pvObjectUrl}" controls autoplay playsinline></video>`);
    } else if(type.startsWith('audio/')){
      setPvBody(`<div class="pv-msg"><b>${escapeHtml(name)}</b><audio src="${pvObjectUrl}" controls autoplay style="margin-top:10px"></audio></div>`);
    } else if(type === 'application/pdf'){
      setPvBody(`<iframe src="${pvObjectUrl}#view=FitH" title="${escapeHtml(name)}"></iframe>`);
    } else if(type === 'text/html'){
      // sandbox="" blocks scripts in stored HTML from touching the portal
      setPvBody(`<iframe src="${pvObjectUrl}" sandbox="" title="${escapeHtml(name)}"></iframe>`);
    } else {
      pvMessage('No preview for .' + ext, 'Download it to open in the right app.');
    }
  }catch(e){
    pvMessage('Could not load the file', e.message + ' — try Open in new tab.');
  }
}

/* --------------------------- download --------------------------- */
async function downloadFile(path){
  const name = baseName(path);
  const { data, error } = await sb.storage.from(BUCKET_NAME).createSignedUrl(path, 120, { download: name });
  if(error){ showToast('Download failed: ' + storageErrorText(error), 'err'); return; }
  // An anchor click survives the await; window.open() after an await is blocked as a popup.
  const a = document.createElement('a');
  a.href = data.signedUrl;
  a.download = name;
  a.rel = 'noopener';
  document.body.appendChild(a);
  a.click();
  a.remove();
}

/* --------------------------- delete --------------------------- */
async function deleteFile(path){
  const ok = await askConfirm({ title:'Delete file', message:`“${baseName(path)}” will be removed for everyone. This cannot be undone.` });
  if(!ok) return;
  const { error } = await sb.storage.from(BUCKET_NAME).remove([path]);
  if(error){ showToast('Delete failed: ' + storageErrorText(error), 'err'); return; }
  showToast('Deleted', 'ok');
  loadFiles();
}

async function collectAllFilePaths(path){
  let paths = [];
  let offset = 0;
  while(true){
    const { data, error } = await sb.storage.from(BUCKET_NAME).list(path, { limit: 100, offset });
    if(error) throw error;
    const batch = data || [];
    for(const item of batch){
      const itemPath = pathJoin(path, item.name);
      if(item.id === null) paths = paths.concat(await collectAllFilePaths(itemPath));
      else paths.push(itemPath);
    }
    if(batch.length < 100) break;
    offset += 100;
  }
  return paths;
}

async function deleteFolder(path){
  const ok = await askConfirm({ title:'Delete folder', message:`“${baseName(path)}” and everything inside it will be removed. This cannot be undone.` });
  if(!ok) return;
  try{
    const paths = await collectAllFilePaths(path);
    for(let i = 0; i < paths.length; i += 100){
      const { error } = await sb.storage.from(BUCKET_NAME).remove(paths.slice(i, i+100));
      if(error) throw error;
    }
    showToast('Folder deleted', 'ok');
    loadFiles();
  }catch(e){
    showToast('Delete failed: ' + storageErrorText(e), 'err');
  }
}

/* --------------------------- upload --------------------------- */
async function createFolder(){
  if(!canUpload()){ showToast('You do not have upload access.', 'err'); return; }
  const answer = await askText({ title:'New folder', label:'Folder name', value:'', okText:'Create' });
  if(answer === null) return;
  const name = cleanName(answer);
  if(!name) return;
  // Supabase Storage has no empty folders — a hidden placeholder file stands in for one
  const placeholderPath = pathJoin(pathJoin(currentPath, name), '.keep');
  const { error } = await sb.storage.from(BUCKET_NAME).upload(placeholderPath, new Blob(['']), { upsert: true, contentType: 'text/plain' });
  if(error){ showToast('Could not create folder: ' + storageErrorText(error), 'err'); return; }
  showToast('Folder created', 'ok');
  loadFiles();
}

function openUpload(){
  if(!canUpload()){ showToast('You do not have upload access.', 'err'); return; }
  document.getElementById('fileInput').value = '';
  document.getElementById('uploadErr').textContent = '';
  document.getElementById('uploadModalSub').textContent =
    currentPath ? `Uploading into "${currentPath}".` : 'Uploading into the top-level folder.';
  document.getElementById('uploadModal').classList.remove('hidden');
}
function closeUploadModal(){ document.getElementById('uploadModal').classList.add('hidden'); }

async function doUpload(){
  const fileInput = document.getElementById('fileInput');
  const file = fileInput.files[0];
  const err = document.getElementById('uploadErr');
  if(!file){ err.textContent = 'Choose a file first.'; return; }
  const btn = document.getElementById('doUploadBtn');
  btn.disabled = true; btn.textContent = 'Uploading...';
  const path = pathJoin(currentPath, file.name);
  // contentType keeps previews working — without it the file lands as octet-stream
  const { error } = await sb.storage.from(BUCKET_NAME).upload(path, file, {
    upsert: true, contentType: file.type || 'application/octet-stream'
  });
  btn.disabled = false; btn.textContent = 'Upload';
  if(error){ err.textContent = 'Upload failed: ' + storageErrorText(error); return; }
  showToast('Uploaded ' + file.name, 'ok');
  closeUploadModal();
  loadFiles();
}

async function uploadFolder(fileList){
  const files = Array.from(fileList || []);
  if(files.length === 0) return;
  let failed = 0, done = 0;
  for(const file of files){
    const relative = file.webkitRelativePath || file.name;
    const path = pathJoin(currentPath, relative);
    const { error } = await sb.storage.from(BUCKET_NAME).upload(path, file, {
      upsert: true, contentType: file.type || 'application/octet-stream'
    });
    if(error) failed++;
    done++;
    showToast(`Uploading… ${done}/${files.length}`);
  }
  document.getElementById('folderInput').value = '';
  showToast(failed > 0 ? `Done — ${failed} file(s) could not be uploaded.` : 'Folder uploaded', failed > 0 ? 'err' : 'ok');
  loadFiles();
}
</script>
